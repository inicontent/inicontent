<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Inicontent ecosystem</title><desc id="desc">A Nuxt app extends the open source Inicontent CMS client, which connects to the proprietary Inicontent API.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1323"/><stop offset="1" stop-color="#162d3a"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#6ce5b2" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="460" rx="24" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="52" y="58" font-size="17" fill="#6ce5b2" font-weight="700">INICONTENT  /  HOW IT FITS TOGETHER</text><text x="52" y="112" font-size="38" fill="#fff" font-weight="700">One client layer. Your own application.</text><text x="52" y="153" font-size="21" fill="#aebed2" font-weight="400">Start with the CMS, extend it with Nuxt, connect it to the API.</text><rect x="52" y="218" width="290" height="140" rx="16" fill="#152238" stroke="#2b3c55"/><text x="74" y="265" font-size="24" fill="#fff" font-weight="700">Your Nuxt app</text><text x="74" y="299" font-size="18" fill="#aebed2" font-weight="400">Custom routes &amp; blocks</text><rect x="448" y="218" width="304" height="140" rx="16" fill="#152238" stroke="#2b3c55"/><text x="470" y="265" font-size="24" fill="#fff" font-weight="700">Inicontent CMS</text><text x="470" y="299" font-size="18" fill="#aebed2" font-weight="400">Admin • pages • emails</text><rect x="858" y="218" width="290" height="140" rx="16" fill="#152238" stroke="#2b3c55"/><text x="880" y="265" font-size="24" fill="#fff" font-weight="700">Inicontent API</text><text x="880" y="299" font-size="18" fill="#aebed2" font-weight="400">Data • auth • assets</text><text x="74" y="329" font-size="13" fill="#6ce5b2" font-weight="700">YOUR PROJECT</text><text x="470" y="329" font-size="13" fill="#6ce5b2" font-weight="700">OPEN SOURCE CLIENT</text><text x="880" y="329" font-size="13" fill="#aebed2" font-weight="700">PROPRIETARY BACKEND</text><path d="M342 287 H434 V287" fill="none" stroke="#6ce5b2" stroke-width="3" marker-end="url(#arrow)"/><text x="353" y="264" font-size="15" fill="#aebed2" font-weight="400">extends</text><path d="M752 287 H844 V287" fill="none" stroke="#6ce5b2" stroke-width="3" marker-end="url(#arrow)"/><text x="768" y="264" font-size="15" fill="#aebed2" font-weight="400">REST</text><text x="52" y="418" font-size="18" fill="#aebed2" font-weight="400">Start with inicontent/starter, then add your own routes, components, and blocks.</text></g></svg>
